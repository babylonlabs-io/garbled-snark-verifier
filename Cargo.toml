[package]
name = "garbled-snark-verifier"
version = "0.2.0"
edition = "2024"

[dependencies]
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
bitvec = "1.0.1"
blake3 = { version = "1.6.1", features = ["traits-preview"] }
crossbeam = "0.8.4"
digest = "0.10"
log = "0.4.27"
memory-stats = "1.0"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
rand = "0.9.1"
rayon = "1.10.0"
thiserror = "2.0.12"
bitcoin = "0.32.6"
rand_chacha = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
once_cell = "1.21"
sha2 = "0.10"
aes = "0.8"

[dev-dependencies]
ark-ec = "0.5.0"
test-log = "0.2.8"
